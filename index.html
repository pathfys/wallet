// extract a TON address (+ optional amount/comment) from scanned text or a ton:// / https link
function parseTonQr(text){
  text=String(text||"").trim();
  let addr="", amount="", comment="", isTon=false;
  const am=text.match(/([EU]Q[A-Za-z0-9_\-]{46})/);
  if(/^ton:\/\//i.test(text)||/\/transfer\//i.test(text)){
    isTon=true;
    const t=text.match(/transfer\/([A-Za-z0-9_\-:]+)/); if(t) addr=t[1]; else if(am) addr=am[1];
    try{ const u=new URL(text.replace(/^ton:\/\//i,"https://x/"));
      const a=u.searchParams.get("amount"); if(a&&isFinite(Number(a))) amount=String(Number(a)/1e9);
      const c=u.searchParams.get("text")||u.searchParams.get("comment"); if(c) comment=c;
    }catch(e){}
  } else if(am){ addr=am[1]; }
  else { addr=text; }
  return {addr, amount, comment, isTon};
}
async function handleScanned(text){
  closeModal();
  const {addr,amount,isTon}=parseTonQr(text);
  if(!addr){ return toast("QR-код не распознан","err"); }
  if(!await loadLibs()){ return toast("Нет связи с крипто-библиотекой","err"); }
  try{ TON.Address.parse(addr); }catch(e){ return toast("В QR-коде нет корректного TON-адреса","err"); }
  sendState={asset:(isTon&&amount)?"GRAM":"USDT", to:addr, amount:amount||""};
  if(S.network==="testnet") sendState.asset="GRAM";
  renderSendForm();
  notify("QR отсканирован", shortAddr(addr));
}
async function startQrScan(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg && typeof tg.showScanQrPopup==="function"){
    try{
      tg.showScanQrPopup({text:"Наведите камеру на QR-код адреса"}, (text)=>{ handleScanned(text); return true; });
      return;
    }catch(e){ /* fall back to browser camera */ }
  }
  await openCameraScanner();
}
async function openCameraScanner(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    closeModal(); return toast("Камера недоступна на этом устройстве","err");
  }
  openModal(`${sheetHead("Сканировать QR")}
    <div class="qr-scan"><video id="qrVideo" playsinline muted autoplay></video><div class="qr-frame"></div></div>
    <p class="hint" style="text-align:center;margin:0 0 12px">Наведите камеру на QR-код TON-адреса</p>
    <button class="btn btn-ghost btn-block" data-act="close-modal">Отмена</button>`);
  await loadLibs();
  const jsQR=VENDOR&&VENDOR.jsQR;
  const video=el("qrVideo"); if(!video) return;
  let stream=null, raf=0, stopped=false;
  const stop=()=>{ stopped=true; if(raf) cancelAnimationFrame(raf); if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} } };
  _qrStop=stop;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=stream; await video.play().catch(()=>{});
  }catch(e){ stop(); closeModal(); return toast("Нет доступа к камере","err"); }
  if(!jsQR){ /* camera shows, but no decoder — let user cancel */ return; }
  const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});
  const tick=()=>{
    if(stopped) return;
    if(video.readyState>=2 && video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
        if(code&&code.data){ stop(); handleScanned(code.data); return; }
      }catch(e){}
    }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

async function saveNick(raw,isChange){
  const nick=String(raw||"").trim();
  const fe=nickFormatError(nick); if(fe) return toast(fe,"err");
  try{
    API.me=await api("POST","/api/me/nick",{nick});
    S.profile.nick=API.me.nick; save(); closeModal();

    else { toast("Регистрация завершена","ok"); view="home"; render(); }
  }catch(e){ toast(errMsg(e),"err"); }

async function act(name,ds={}){

      onbStep=2; renderOnboarding(); break;
    }
    case "onb-back": onbStep=1; onbMnemonic=null; renderOnboarding(); break;
    case "copy-seed": if(onbMnemonic) await copySecret(onbMnemonic.join(" ")); break;
    case "onb-confirm": await finalizeCreate(); break;
    case "onb-import": await modalImport(); break;

    /* lock */
    case "unlock": await doUnlock(); break;
    case "bio-unlock": await doBioUnlock(); break;
    case "toggle-bio": await toggleBio(); break;
    case "forgot": await modalImport(true); break;
    case "lock-now": lockWallet(); break;

    /* nav */
    case "tab": view=ds.tab; hideModalNav(); render(); if(view==="p2p") refreshOrdersCount(); break;
    case "go-settings": view="settings"; render(); break;
    case "back-home": view="home"; render(); break;
    case "go-history": modalHistory(); break;
    case "refresh": toast("Обновление…"); await refreshBalances(); await fetchPrices(); break;
    case "toggle-balance": hideBalance=!hideBalance; renderCurrent(); break;
    case "card-skin": modalCardSkin(); break;
    case "flip-card": { cardFlipped=!cardFlipped; const c=document.querySelector(".card-inner"); if(c) c.classList.toggle("flipped",cardFlipped); } break;
    case "pick-skin": if(CARD_SKINS.some(s=>s.k===ds.v)){ S.cardSkin=ds.v; save(); } closeModal(); renderHome(); toast("Фон карты обновлён","ok"); break;

    /* wallet */
    case "qr-menu": modalQr(); break;
    case "scan-qr": await startQrScan(); break;
    case "deposit": await modalDeposit(); break;
    case "send": modalSend(ds.asset); break;
    case "asset": { const a=ds.asset; if(ASSET_META[a]&&ASSET_META[a].onTon) modalSend(a); } break;
    case "copy-addr": { const a=friendlyAddr(); if(a){ await copy(a); toast("Адрес скопирован","ok"); } } break;
    case "copy-text": if(ds.v){ await copy(ds.v); toast("Скопировано","ok"); } break;
    case "send-asset": if(ASSET_META[ds.v]){ const ti=el("sendTo"); if(ti) sendState.to=ti.value; sendState.asset=ds.v; renderSendForm(); } break;
    case "send-max": {
      const a=sendState.asset, dec=ASSET_META[a].dec;
      let u=balUnits(a); if(a==="GRAM") u=u>50000000n?u-50000000n:0n;
      sendState.amount=unitsStr(u,dec); renderSendForm(); break;
    }
    case "send-next": await sendNext(); break;
    case "send-back": renderSendForm(); break;
    case "send-go": await sendGo(); break;

    /* p2p market */
    case "p2p-side": P2P.side=ds.v==="sell"?"sell":"buy"; P2P.ads=null; renderP2P(); break;
    case "p2p-asset": if(CRYPTOS.includes(ds.v)){ P2P.asset=ds.v; P2P.ads=null; renderP2P(); } break;
    case "p2p-refresh": P2P.ads=null; renderP2P(); refreshOrdersCount(); break;
    case "filters": modalFilters(); break;
    case "apply-filters": if(readFilters()){ closeModal(); renderP2P(); } break;
    case "reset-filters": P2P.fiat=""; P2P.pay=""; P2P.amount=""; P2P.ads=null; closeModal(); renderP2P(); break;
    case "take-ad": if(p2pBlockReason()) return toast(p2pBlockReason(),"err"); await modalTakeAd(ds.id); break;
    case "take-mode": takeState.mode=ds.v==="crypto"?"crypto":"fiat"; takeState.value=""; renderTake(); break;
    case "take-pay": syncTake(); takeState.payType=ds.v; renderTake(); break;
    case "take-pm": syncTake(); takeState.pmId=Number(ds.id); renderTake(); break;
    case "take-max": {
      const ad=takeState.ad;
      if(takeState.mode==="fiat") takeState.value=ad.maxEffective;
      else { const p=toUnits(ad.price,6), dec=ASSET_META[ad.asset].dec; const byMax=toUnits(ad.maxEffective,2)*10n**BigInt(dec)*1000000n/(p*100n); const av=toUnits(ad.available,dec); takeState.value=unitsStr(byMax<av?byMax:av,dec); }
      const i=el("tkAmt"); if(i) i.value=takeState.value; updTake(); break;
    }
    case "take-go": await takeGo(); break;
    case "my-orders": if(p2pBlockReason()) return toast(p2pBlockReason(),"err"); await modalMyOrders(); break;
    case "orders-tab": ordersTab=ds.v==="done"?"done":"active"; await modalMyOrders(); break;

    case "adf-save": await saveAd(); break;

    case "order-release": await orderRelease(); break;
    case "order-appeal": modalAppeal(); break;
    case "order-appeal-cancel": try{ curOrder=await api("POST",`/api/orders/${curOrderId}/appeal/cancel`,{}); renderOrderBody(); toast("Апелляция отменена",""); }catch(e){ toast(errMsg(e),"err"); } break;
    case "order-report": modalReport(); break;
    case "fb-pick": fbDraft.positive=ds.v==="1"; fbDraft.comment=(el("fbText")||{}).value||""; renderOrderBody(); break;
    case "fb-send": {
      if(fbDraft.positive==null) return toast("Выберите оценку","err");
      try{ await api("POST",`/api/orders/${curOrderId}/feedback`,{positive:fbDraft.positive,comment:(el("fbText")||{}).value||""}); fbDraft={positive:null,comment:""}; toast("Спасибо за отзыв","ok"); await reloadOrder(); }catch(e){ toast(errMsg(e),"err"); }

// Защита от перебора: после 5 ошибок — растущая пауза (30 с … 1 ч), сохраняется между перезапусками.
async function unlockWith(pw,{bio=false}={}){
  if(S.unlockBlockedUntil>Date.now()){ toast("Слишком много попыток. Подождите до "+new Date(S.unlockBlockedUntil).toLocaleTimeString("ru-RU"),"err"); return false; }
  if(!await loadLibs()){ toast("Крипто-модуль не загрузился. Обновите страницу.","err"); return false; }
  let words;
  try{ words=(await decryptSeed(S.enc,pw)).split(" "); }
  catch(e){
    S.unlockFails=(S.unlockFails||0)+1;
    if(S.unlockFails>=5) S.unlockBlockedUntil=Date.now()+Math.min(3600000,30000*Math.pow(2,S.unlockFails-5));
    save(); toast(bio?"Не удалось войти по биометрии":"Неверный пароль","err");
    if(S.unlockFails>=5) renderLock();
    return false;
  }
  const d=await deriveFromMnemonic(words);
  if(d.raw!==S.addressRaw){ toast("Ключ не соответствует адресу кошелька","err"); return false; }
  if(!S.enc.iter||S.enc.iter<KDF_ITER){ try{ S.enc=await encryptSeed(words.join(" "),pw); }catch(e){} }
  words.fill(""); words=null;
  session.key=d.key; session.unlocked=true;
  S.locked=false; S.unlockFails=0; S.unlockBlockedUntil=0; save(); view="home";
  afterUnlock();
  return true;
}

    const a=friendlyAddr();
    closeModal();
    modalResult(true,"Отправлено",`Транзакция передана в сеть. Баланс обновится после подтверждения.${fee>0?`<br>Комиссия сервиса ${fmtCrypto(fee)} ${asset} удержана.`:""}`,explorerUrl(a));
    setTimeout(refreshBalances,6000);
  }catch(e){
    console.error(e);
    closeModal();
    modalResult(false,"Не удалось отправить", esc((e&&e.message)||"Ошибка сети. Попробуйте позже."));
  }
}
/* ---------- history ---------- */
function modalHistory(){
  const h=S.history;
  const rows=h.length?h.map(x=>{
    const sign=x.type==="receive"?"+":x.type==="p2p-release"?"":"−";
    const color=x.type==="receive"?"var(--buy)":(x.type==="fee"?"var(--warn)":"var(--ink)");
    const t=x.type==="send"?"Отправка":x.type==="receive"?"Пополнение":x.type==="p2p-release"?"P2P: выпуск из эскроу":x.type==="p2p-lock"?"P2P: блокировка в эскроу":x.type==="pin"?"Закрепление объявления":x.type==="fee"?"Комиссия сервиса":x.type;
    return `<div class="asset" style="border-top:1px solid var(--line)">
      <div class="coin" style="width:36px;height:36px;background:var(--panel-3);color:var(--ink-2)">${x.type==="receive"?I.down:I.up}</div>
      <div class="nm"><b>${t}</b><span>${esc(shortAddr(x.addr))} · ${nowShort(x.ts)}</span></div>
      <div class="bal"><b style="color:${color}">${sign}${fmtCrypto(x.amount)} ${esc(x.asset)}</b><span>${esc(x.net)}</span></div>
    </div>`;
  }).join(""):`<div class="empty">Пока нет операций.</div>`;
  openModal(`${sheetHead("История")}
    <div class="assets" style="background:transparent;border:none">${rows}</div>
    ${h.length?`<a class="tlink" style="display:block;text-align:center;margin-top:14px" href="${esc(explorerUrl(friendlyAddr()))}" target="_blank" rel="noopener noreferrer">Все операции в обозревателе ↗</a>`:""}`);
}
</script>
