<meta name="description" content="PMR Wallet — некастодиальный криптокошелёк сети TON: TON (GRAM) и USDT, приём и отправка, P2P с блокировкой средств.">
<title>PMR Wallet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Cpath d='M9 12h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H9z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%23fff'/%3E%3C/svg%3E">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===================== design tokens ===================== */
:root{
  --bg:#0c0d10; --bg-2:#0f1116; --panel:#14161b; --panel-2:#191c22; --panel-3:#20242c;
  --line:#23262e; --line-2:#2c313b;
  --ink:#f4f6fa; --ink-2:#a3abb6; --ink-3:#6b7280; --ink-4:#4b515c;
  --primary:#2f6bff; --primary-2:#5b8bff; --primary-strong:#2457e0;
  --primary-ghost:rgba(47,107,255,.14); --primary-rgb:47,107,255;
  --on-primary:#ffffff; --surface-light:#eef1f6; --on-light:#0f1319;
  --buy:#2ebd85; --buy-ghost:rgba(46,189,133,.14);
  --sell:#f6465d; --sell-ghost:rgba(246,70,93,.14);
  --warn:#f0b90b; --warn-ghost:rgba(240,185,11,.14);
  --btc:#f7931a; --eth:#627eea; --usdt:#26a17b; --ton:#0098ea;
  --font:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --display:"Inter","Segoe UI",sans-serif;
  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --gut:16px; --tabbar-h:72px;
  --sh-1:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --sh-card:0 24px 60px -30px rgba(var(--primary-rgb),.55);
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f6f8fb; --panel-3:#eef1f6;
  --line:#e4e8ef; --line-2:#d9dee8;
  --ink:#0f1319; --ink-2:#4b5562; --ink-3:#7b8494; --ink-4:#aab2bf;
  --surface-light:#0f1319; --on-light:#ffffff;
  --sh-1:0 1px 2px rgba(15,19,25,.05),0 10px 24px -18px rgba(15,19,25,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;}
button{cursor:pointer;}
input,textarea,select{outline:none;}
svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.9;}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.muted{color:var(--ink-3);} .dim{color:var(--ink-2);}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}

/* ===================== app frame ===================== */
#app{min-height:100%;width:100%;margin:0;position:relative;display:flex;flex-direction:column;padding-top:var(--tg-safe-area-inset-top,0px);}
.screen{flex:1;min-width:0;padding:14px var(--gut) calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));}
.screen.no-tab{padding-bottom:calc(28px + env(safe-area-inset-bottom));}

/* topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 2px 16px;}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-right:auto;}
.topbar .sub{font-size:12px;color:var(--ink-3);font-weight:600;}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);transition:.18s var(--ease);}
.iconbtn:active{transform:scale(.94);} .iconbtn svg{width:19px;height:19px;}
.backbtn{width:42px;height:42px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;}

/* balance card */
.balance{position:relative;border-radius:var(--r-xl);padding:20px 20px 18px;color:#fff;overflow:hidden;
  background:linear-gradient(140deg,#6a97ff 0%,#2f6bff 46%,#1f4fd6 100%);box-shadow:var(--sh-card);}
.balance::after{content:"";position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 90% at 85% -10%,rgba(255,255,255,.26),transparent 55%);pointer-events:none;}
/* background figure: topographic contours (D) + soft aurora depth (C) */
.card-fig{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit;}
.card-fig::before{content:"";position:absolute;inset:0;background:
  radial-gradient(62% 84% at 82% 100%,rgba(255,255,255,.26),transparent 62%),
  radial-gradient(50% 64% at 100% 20%,rgba(255,255,255,.12),transparent 64%),
  radial-gradient(40% 50% at 8% 2%,rgba(255,255,255,.1),transparent 55%);}
/* soft diagonal light sweep for a polished, glossy finish */
.card-fig::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(118deg,transparent 40%,rgba(255,255,255,.08) 49%,rgba(255,255,255,.015) 54%,transparent 68%);}
.card-fig .fig-topo{position:absolute;inset:0;width:100%;height:100%;opacity:.16;}
.balance .row1{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.balance .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.82;}
.balance .big{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.025em;margin:12px 0 10px;position:relative;z-index:1;font-variant-numeric:tabular-nums;}
.balance .big small{font-size:24px;opacity:.72;font-weight:700;}
.balance .foot{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.balance .chg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;letter-spacing:-.01em;padding:5px 10px;border-radius:10px;background:rgba(8,12,20,.22);}
.balance .chg.up{color:#4cf0ad;} .balance .chg.down{color:#ff8192;}
.balance .chg .chg-sub{color:rgba(255,255,255,.7);font-weight:600;font-size:10.5px;}
.balance .cur{font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:8px;}
.balance .mini{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;}
.balance .mini svg{width:17px;height:17px;}
/* EMV chip on the balance card */
.card-chip{position:absolute;right:20px;top:56px;width:46px;height:34px;border-radius:7px;z-index:1;overflow:hidden;
  background:linear-gradient(135deg,#fdf1b8 0%,#ecce70 34%,#d4ab45 62%,#f6e29a 100%);
  box-shadow:inset 0 0 0 1px rgba(150,112,30,.55),inset 0 1px 2px rgba(255,255,255,.65),0 2px 7px rgba(0,0,0,.33);}
.card-chip::before{content:"";position:absolute;inset:0;background:
  linear-gradient(to right,transparent 30%,rgba(122,92,24,.42) 30%,rgba(122,92,24,.42) 31%,transparent 31%,transparent 69%,rgba(122,92,24,.42) 69%,rgba(122,92,24,.42) 70%,transparent 70%),
  linear-gradient(to bottom,transparent 32%,rgba(122,92,24,.42) 32%,rgba(122,92,24,.42) 33%,transparent 33%,transparent 67%,rgba(122,92,24,.42) 67%,rgba(122,92,24,.42) 68%,transparent 68%);}
.card-chip::after{content:"";position:absolute;left:31%;top:33%;right:31%;bottom:33%;border:1px solid rgba(122,92,24,.45);border-radius:2px;}
/* premium gloss highlight (top-left) on top of the top-right radial */
.balance::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(135% 120% at 12% -8%,rgba(255,255,255,.26),transparent 44%);}
/* card skins (насыщенные градиенты) */
.skin-midnight{background:radial-gradient(120% 95% at 80% -10%,rgba(95,135,255,.55),transparent 55%),linear-gradient(150deg,#1e3fc4 0%,#13268f 45%,#060a2e 100%);}
.skin-blue{background:linear-gradient(140deg,#5b86ff 0%,#2f6bff 45%,#0d2fb0 100%);}
.skin-ocean{background:radial-gradient(120% 100% at 85% -12%,rgba(0,224,255,.5),transparent 55%),linear-gradient(140deg,#0bb7f0 0%,#1f6dff 52%,#07237a 100%);}
.skin-aurora{background:linear-gradient(135deg,#10c9a3 0%,#2f6bff 50%,#8b45ff 100%);}
.skin-sunset{background:linear-gradient(135deg,#ff8a3c 0%,#f5375d 46%,#9b2ad6 100%);}
.skin-magma{background:radial-gradient(120% 100% at 80% -14%,rgba(255,170,90,.55),transparent 54%),linear-gradient(140deg,#ff5e2e 0%,#e01045 52%,#3e0824 100%);}
.skin-amethyst{background:linear-gradient(140deg,#b79bff 0%,#7c2fff 48%,#330f88 100%);}
.skin-emerald{background:radial-gradient(120% 100% at 80% -12%,rgba(42,224,150,.5),transparent 55%),linear-gradient(150deg,#0e8f5e 0%,#064a31 55%,#021309 100%);}
.skin-obsidian{background:radial-gradient(120% 100% at 80% -14%,rgba(120,140,200,.3),transparent 50%),linear-gradient(145deg,#2a2f3c 0%,#0a0c12 82%);}
.skin-graphite{background:linear-gradient(145deg,#6b7280 0%,#2e333d 50%,#0b0d12 100%);}
.skin-gold{background:linear-gradient(140deg,#ffe9a6 0%,#e0b64f 42%,#8a6a1f 100%);}
/* glowing cards — soft, subtle */
.balance.skin-midnight{box-shadow:0 8px 26px -14px rgba(37,74,220,.5),0 22px 54px -30px rgba(20,32,120,.55);}
.balance.skin-blue{box-shadow:0 8px 26px -14px rgba(47,107,255,.5),0 22px 54px -30px rgba(13,47,176,.55);}
.balance.skin-ocean{box-shadow:0 8px 26px -14px rgba(0,180,235,.5),0 22px 54px -30px rgba(7,35,122,.55);}
.balance.skin-aurora{box-shadow:0 8px 26px -14px rgba(47,160,230,.5),0 22px 54px -30px rgba(124,58,237,.5);}
.balance.skin-sunset{box-shadow:0 8px 26px -14px rgba(245,55,93,.5),0 22px 54px -30px rgba(139,42,214,.5);}
.balance.skin-magma{box-shadow:0 8px 26px -14px rgba(255,94,46,.5),0 22px 54px -30px rgba(224,16,69,.5);}
.balance.skin-amethyst{box-shadow:0 8px 26px -14px rgba(124,47,255,.5),0 22px 54px -30px rgba(51,15,136,.55);}
.balance.skin-emerald{box-shadow:0 8px 26px -14px rgba(23,192,138,.5),0 22px 54px -30px rgba(5,45,28,.55);}
.balance.skin-obsidian{box-shadow:0 8px 26px -16px rgba(110,130,180,.35),0 22px 54px -30px rgba(0,0,0,.6);}
.balance.skin-graphite{box-shadow:0 8px 26px -16px rgba(150,160,180,.4),0 22px 54px -30px rgba(0,0,0,.55);}
.balance.skin-gold{box-shadow:0 8px 26px -14px rgba(217,178,78,.5),0 22px 54px -30px rgba(90,70,20,.55);}
/* card skin picker */
.skin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.skin-opt{text-align:left;padding:0;background:none;border:none;}
.skin-sw{height:66px;border-radius:14px;position:relative;overflow:hidden;border:1px solid var(--line);}
.skin-sw::after{content:"";position:absolute;left:12px;top:13px;width:22px;height:16px;border-radius:4px;background:linear-gradient(135deg,#f7e9ad,#c99f3c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);}
.skin-opt .skin-nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:8px 2px 0;color:var(--ink-2);}
.skin-opt.on .skin-nm{color:var(--ink);}
.skin-opt.on .skin-sw{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary);}
.skin-opt .skin-nm svg{width:15px;height:15px;color:var(--primary);}
/* 3D flip card + entry (mobile-safe: single preserve-3d + opacity face-swap) */
.card3d{perspective:780px;position:relative;z-index:0;}
/* animated glowing halo behind the card (colour comes from --card-glow) — soft */
.card3d::before{content:"";position:absolute;left:10px;right:10px;top:16px;bottom:-4px;z-index:-1;border-radius:var(--r-xl);
  pointer-events:none;background:var(--card-glow,#2457e0);filter:blur(26px);opacity:.26;transform:scale(.95);
  animation:cardPulse 5.5s var(--ease) infinite;}
@keyframes cardPulse{0%,100%{opacity:.2;}50%{opacity:.34;}}
.card3d.intro{animation:cardIn .85s var(--ease) both;}
/* idle 3D float so the card reads as a physical object, not a flat rectangle */
.card-float{transform-style:preserve-3d;animation:cardFloat 9s ease-in-out infinite;}
@keyframes cardFloat{0%,100%{transform:rotateY(0) rotateX(0);}30%{transform:rotateY(-5deg) rotateX(3deg);}62%{transform:rotateY(5deg) rotateX(-2.4deg);}}
@media (prefers-reduced-motion:reduce){.card3d::before,.card-float{animation:none;}}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.75,.2,1);cursor:pointer;}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:opacity 0s linear .34s;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 1px rgba(255,255,255,.16),inset 0 -14px 30px -18px rgba(0,0,0,.4);}
.card-face.front{opacity:1;}
.card-face.back{position:absolute;inset:0;transform:rotateY(180deg);opacity:0;}
.card-inner.flipped .card-face.front{opacity:0;}
.card-inner.flipped .card-face.back{opacity:1;}
@keyframes cardIn{0%{opacity:0;transform:perspective(1100px) rotateY(-26deg) translateY(10px) scale(.95);}100%{opacity:1;transform:perspective(1100px) rotateY(0) translateY(0) scale(1);}}
/* back side: clean white name strip, no black lines */
.back-sheen{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:
  linear-gradient(120deg,transparent 38%,rgba(255,255,255,.1) 50%,transparent 62%),
  radial-gradient(60% 80% at 85% 10%,rgba(255,255,255,.14),transparent 60%);}
.back-name{position:absolute;left:20px;right:20px;top:34px;height:40px;border-radius:9px;z-index:1;
  background:linear-gradient(180deg,#ffffff 0%,#eef1f6 100%);display:flex;align-items:center;gap:10px;padding:0 15px;
  box-shadow:0 3px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 2px rgba(0,0,0,.06);}
.back-name .nm{font-family:"Caveat",cursive;font-weight:700;color:#171a21;font-size:28px;line-height:1;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.back-name .tag{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.14em;color:#9aa1b2;text-transform:uppercase;flex:0 0 auto;}
.back-brand{position:absolute;left:20px;bottom:14px;z-index:1;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);}
.back-logo{position:absolute;right:18px;bottom:11px;z-index:1;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#fff;}
/* faint TON-diamond watermark bottom-right */
.back-mark{position:absolute;right:20px;top:92px;z-index:0;width:66px;height:66px;opacity:.14;pointer-events:none;}
.back-mark svg{width:100%;height:100%;}

/* primary actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:15px;font-weight:700;font-size:15px;
  padding:15px 14px;transition:.16s var(--ease);border:1px solid transparent;}
.btn:active{transform:scale(.975);}
.btn svg{width:18px;height:18px;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 12px 26px -14px rgba(var(--primary-rgb),.9);}
.btn-primary:disabled{opacity:.5;box-shadow:none;}
.btn-light{background:var(--surface-light);color:var(--on-light);}
.btn-ghost{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
.btn-block{width:100%;}
.btn-lg{padding:17px;font-size:16px;border-radius:17px;}
.btn[disabled]{cursor:not-allowed;opacity:.55;}

/* section head */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px;}
.sec-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.sec-head .count{font-size:13px;color:var(--ink-3);font-weight:600;}

/* asset list */
.assets{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.asset{display:flex;align-items:center;gap:13px;padding:14px 15px;transition:.14s var(--ease);}
.asset:active{background:var(--panel-2);}
.asset + .asset{border-top:1px solid var(--line-soft,var(--line));}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:#fff;font-weight:800;}
.coin.coin-img{background:transparent!important;border-radius:0;}
.coin.coin-img img{width:40px;height:40px;object-fit:contain;display:block;}
.asset .nm{min-width:0;}
.asset .nm b{font-size:15px;font-weight:700;display:block;}
.asset .nm span{font-size:12px;color:var(--ink-3);font-weight:600;}
.asset .bal{margin-left:auto;text-align:right;}
.asset .bal b{font-size:15px;font-weight:700;font-family:var(--mono);display:block;}
.asset .bal span{font-size:11.5px;color:var(--ink-3);font-weight:600;}
.asset.off{opacity:.62;}
.asset .tag{font-size:9.5px;color:var(--ink-4);font-weight:700;letter-spacing:.04em;}

/* ===================== onboarding ===================== */
.onb{min-height:100vh;display:flex;flex-direction:column;padding:26px var(--gut) calc(26px + env(safe-area-inset-bottom));
  background:radial-gradient(130% 80% at 50% -5%,#15223f 0%,var(--bg) 52%);}
.onb .head{display:flex;align-items:center;justify-content:space-between;}
.onb .step{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;}
.onb .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
.hero-badge{width:118px;height:118px;border-radius:34px;position:relative;display:grid;place-items:center;margin-bottom:26px;
  background:linear-gradient(150deg,#243b6e,#141922);box-shadow:0 30px 70px -30px rgba(var(--primary-rgb),.7),0 0 0 1px var(--line) inset;}
.hero-badge::after{content:"";position:absolute;inset:-28px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(var(--primary-rgb),.35),transparent 68%);}
.hero-badge svg{width:52px;height:52px;color:#cdd9ff;}
.hero-badge .shield{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:13px;background:var(--primary);
  display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(var(--primary-rgb),.9);}
.hero-badge .shield svg{width:20px;height:20px;color:#fff;}
/* light theme adjustments */
:root[data-theme="light"] .onb{background:radial-gradient(130% 80% at 50% -5%,#dbe7ff 0%,var(--bg) 54%);}
:root[data-theme="light"] .hero-badge{background:linear-gradient(150deg,#dbe7ff,#f1f5fb);box-shadow:0 30px 70px -30px rgba(var(--primary-rgb),.45),0 0 0 1px var(--line) inset;}
:root[data-theme="light"] .hero-badge svg{color:var(--primary);}
:root[data-theme="light"] body::after{display:none;}
.onb .kicker{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--primary-2);text-transform:uppercase;}
.onb h2{font-size:33px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:4px 0 8px;max-width:11ch;}
.onb .lead{color:var(--ink-2);font-size:15px;max-width:30ch;margin-bottom:14px;}
.onb-accent{display:inline-flex;align-items:center;gap:8px;margin:0 0 24px;font-size:13.5px;font-weight:700;color:var(--primary-2);background:var(--primary-ghost);border:1px solid rgba(var(--primary-rgb),.28);padding:10px 15px;border-radius:12px;max-width:32ch;line-height:1.35;text-align:left;}
.onb-accent svg{width:17px;height:17px;flex:0 0 auto;}
.onb .feats{display:flex;flex-direction:column;gap:18px;width:100%;max-width:340px;text-align:left;}
.feat{display:flex;gap:13px;align-items:flex-start;}
.feat .fi{width:38px;height:38px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--primary-2);}
.feat .fi svg{width:19px;height:19px;}
.feat b{font-size:14.5px;font-weight:700;display:block;}
.feat span{font-size:13px;color:var(--ink-3);}
.onb .cta{margin-top:26px;}

/* ===================== P2P: my-orders button + chat ===================== */

<body>
<div id="app"></div>
<div class="tabbar" id="tabbar" style="display:none"></div>
<div class="modal-root" id="modal"></div>
<div id="toast"></div>

<script type="module">
/* ========================================================================
   PMR Wallet — некастодиальный TON-кошелёк (TON/GRAM + USDT) + P2P.
   Крипто-библиотеки грузятся динамически; интерфейс работает даже без сети.
   ======================================================================== */

/* ---------- lazy crypto libs ---------- */
let TON=null, TCRYPTO=null, QR=null, cryptoReady=false, libsPromise=null;
// Несколько CDN-зеркал. Если одно заблокировано/недоступно — берём следующее,
// поэтому ошибка «нет связи» появляется только при полном отсутствии интернета.
const CDN_PROVIDERS=[
  (p)=>`https://esm.sh/${p}`,
  (p)=>`https://cdn.jsdelivr.net/npm/${p}/+esm`,
  (p)=>`https://unpkg.com/${p}?module`,
];
async function importPkg(pkg){
  let err;
  for(const make of CDN_PROVIDERS){
    try{ return await import(make(pkg)); }
    catch(e){ err=e; }
  }
  throw err||new Error("import failed: "+pkg);
}
async function loadLibs(){
  if(cryptoReady) return true;
  if(libsPromise) return libsPromise;
  libsPromise=(async()=>{
    try{
      try{ const buf=await importPkg("buffer@6.0.3"); globalThis.Buffer=globalThis.Buffer||buf.Buffer; }catch(e){}
      TCRYPTO=await importPkg("@ton/crypto@3.3.0");
      TON=await importPkg("@ton/ton@15.1.0");
      try{ QR=(await importPkg("qrcode@1.5.4")).default; }catch(e){ QR=null; }
      cryptoReady=true; return true;
    }catch(e){ console.warn("[PMR] crypto libs failed:",e); cryptoReady=false; libsPromise=null; return false; }
  })();
  return libsPromise;
}

/* ---------- constants ---------- */
const USDT_MASTER="EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs"; // USD₮ jetton master (mainnet)
const ENDPOINTS={
  mainnet:"https://toncenter.com/api/v2/jsonRPC",
  testnet:"https://testnet.toncenter.com/api/v2/jsonRPC",
};
const SCAN={mainnet:"https://tonviewer.com",testnet:"https://testnet.tonviewer.com"};

/* ---------- platform fees ---------- */
// Адрес, на который приложение автоматически отправляет комиссию (fee-кошелёк).
// Комиссия работает ТОЛЬКО пока пользователь в этом приложении: некастодиальный
// кошелёк нельзя заставить платить, если ключи вынесут в сторонний клиент.
const FEE_WALLET="UQAtqU5yzF4yMzJqqvCSJxH9dgaOr8Mciuikl3ws66scVoaW";
const WITHDRAW_FEE_RATE=0.01;   // 1% на вывод (перевод на сторону)
const P2P_FEE_SIDE_RATE=0.005;  // 0.5% с каждой стороны P2P
const MAX_FEE_SIDE_USD=2;       // максимум $2 с одной стороны ордера
const MAX_FEE_ORDER_USD=4;      // максимум $4 за ордер суммарно (планка, менять нельзя)
function feeEnabled(){ return typeof FEE_WALLET==="string" && FEE_WALLET.length>40; }
function assetUsd(asset){ const m=ASSET_META[asset]; if(!m) return 0; return prices[m.cg]||(asset==="USDT"?1:0); }
// комиссия вывода — ровно 1% от суммы (без кэпа; кэп $4/$2 относится только к P2P-ордеру)
function withdrawFee(asset,amount){
  if(!feeEnabled()) return 0;
  return amount*WITHDRAW_FEE_RATE;
}
// комиссия одной стороны P2P в единицах актива (кэп $2)
function p2pSideFee(asset,amount){
  if(!feeEnabled()) return 0;
  let fee=amount*P2P_FEE_SIDE_RATE;
  const p=assetUsd(asset);
  if(p>0) fee=Math.min(fee, MAX_FEE_SIDE_USD/p);
  return fee;
}

function b64(u8){ let s=""; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }

function fmtCrypto(x,dec=4){
  const n=Number(x);

}

// raw bigint-string units -> human float
function fromUnits(raw,dec){ try{ return Number(BigInt(raw))/Math.pow(10,dec); }catch(e){ return Number(raw)/Math.pow(10,dec)||0; } }
// human string/float -> bigint units
function toUnits(amount,dec){
  const s=String(amount).trim().replace(",",".");
  if(!/^\d*\.?\d*$/.test(s)||s==="") throw new Error("bad amount");
  const [i,f=""]=s.split(".");
  const frac=(f+"0".repeat(dec)).slice(0,dec);
  return BigInt((i||"0")+frac);
}
function humanBal(asset){
  const m=ASSET_META[asset];
  if(!m) return 0;
  return fromUnits(S.balances[asset]||"0", m.dec);
}
function lockedFor(asset){
  return S.locks.filter(l=>l.asset===asset).reduce((a,l)=>a+Number(l.amount||0),0);
}
function availableFor(asset){ return Math.max(0, humanBal(asset)-lockedFor(asset)); }

function usdOf(asset,amount){
  const m=ASSET_META[asset]; if(!m) return 0;
  const p=prices[m.cg]||(asset==="USDT"?1:0);
  return amount*p;
}
function totalUsd(){
  let t=0;
  for(const a of CRYPTOS) t+=usdOf(a,humanBal(a));
  return t;
}
// 24h portfolio change in USD + %, from each held asset's price move
function portfolioChange(){
  let now=0, then=0, has=false;
  for(const a of CRYPTOS){
    const amt=humanBal(a); if(amt<=0) continue;
    const p=assetUsd(a); if(!p) continue;
    const vNow=amt*p; now+=vNow;
    const chg=prices._chg[ASSET_META[a].cg];
    if(typeof chg==="number" && (1+chg/100)>0){ then+=vNow/(1+chg/100); has=true; }
    else { then+=vNow; }
  }
  const usd=now-then;
  const pct= then>0 ? usd/then*100 : 0;
  return {usd, pct, up: usd>=0, has: has && now>0};
}

/* Basic profanity filter. Blocklist compiled from public open-source
   obscenity word lists (RU + EN roots). Input is normalised against common
   leet-speak and latin/cyrillic homoglyph obfuscation, then checked for any
   banned root as a substring. Not exhaustive — a pragmatic client-side guard. */
const BAD_WORD_ROOTS=[
  // --- cyrillic roots (kept specific to avoid false positives) ---
  "хуй","хуе","хуя","хуи","хуё","хуям","хуями",
  "пизд","пизж","пезд",
  "ебан","ебат","ебах","ебал","ебуч","ёбан","ёбну","заеб","наеб","проеб","выеб","отъеб","долбоеб","долбоёб","далбаёб","долбаеб",
  "блят","бляд","блядь","блядо","блядок","бляц",
  "сука","суки","суку","сучар","сучка",
  "мудак","мудил","мудач",
  "пидор","пидар","пидр","пидер","педик","педераст","пидрил","пидорас",
  "гандон","гондон",
  "залуп","дроч","мразь","говн","гавн","жопа","шлюх","гнида","пидар",
  // --- latin / translit roots ---
  "fuck","motherfuck","shit","bullshit","bitch","cunt","asshole","bastard","whore","nigger","nigga","faggot","pizda","pizdec",
  "pidor","pidar","pidr","pidoras","pedik","pederast",
  "eblan","ebal","ebat","ebla","yobn","ohuel","ahuel",
  "xyi","xuy","huy","hui","huj","blyad","blyat","suka","suchka","mudak","mydak","mudila","gandon","gondon","zalupa","drochit","droch","dolboeb","dolbaeb","govno","gavno","zhopa","shluha","mraz",
];
const LEET_MAP={"0":"o","1":"i","3":"e","4":"a","5":"s","6":"g","7":"t","8":"b","9":"g","@":"a","$":"s","!":"i","|":"i","€":"e"};
const CYR2LAT={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
const LAT2CYR={a:"а",b:"б",c:"с",d:"д",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"й",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"к",r:"р",s:"с",t:"т",u:"у",v:"в",w:"в",x:"х",y:"у",z:"з"};
function normBase(s){
  let t=String(s||"").toLowerCase();
  t=t.replace(/[0-9@$!|€]/g,c=>LEET_MAP[c]||"");
  return t.replace(/[^a-zа-яё]/g,""); // strip spaces/underscores/punctuation
}
function translitCyr(s){ return s.replace(/[а-яё]/g,c=>CYR2LAT[c]!=null?CYR2LAT[c]:c); }
function translitLat(s){ return s.replace(/[a-z]/g,c=>LAT2CYR[c]||c); }
function isProfane(nick){
  const base=normBase(nick);
  if(!base) return false;
  const variants=[base, translitCyr(base), translitLat(base)];
  return BAD_WORD_ROOTS.some(root=>variants.some(v=>v.includes(root)));
}
// -> {ok:true} or {ok:false, reason:"..."}
function validateNick(raw){
  const nick=String(raw||"").trim();
  if(nick.length<3) return {ok:false,reason:"Ник слишком короткий (минимум 3 символа)"};
  if(nick.length>16) return {ok:false,reason:"Ник слишком длинный (максимум 16 символов)"};
  if(!/^[A-Za-zА-Яа-яЁё0-9_.\-]+$/.test(nick)) return {ok:false,reason:"Разрешены буквы, цифры, _ . -"};
  if(!/[A-Za-zА-Яа-яЁё]/.test(nick)) return {ok:false,reason:"Ник должен содержать хотя бы одну букву"};
  if(isProfane(nick)) return {ok:false,reason:"Недопустимый ник. Нецензурные слова запрещены."};
  const taken=(S.offers||[]).some(o=>!o.mine&&(o.name||"").toLowerCase()===nick.toLowerCase());
  if(taken) return {ok:false,reason:"Такой ник уже занят"};
  return {ok:true};
}

/* ---------- WebCrypto seed encryption ---------- */
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:160000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptSeed(mnemonic,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(mnemonic));
  return {salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))};
}
async function decryptSeed(enc,pw){
  const key=await deriveKey(pw,ub64(enc.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(enc.iv)},key,ub64(enc.data));
  return new TextDecoder().decode(pt);
}

function tgBio(){ try{ return window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.BiometricManager; }catch(e){ return null; } }
function bioSecret(){ return "pmr-bio-"+(navigator.userAgent||"x"); }
async function bioAvailable(){
  const b=tgBio();
  if(b){ return await new Promise(r=>{ try{ if(b.isInited) return r(!!b.isBiometricAvailable); b.init(()=>r(!!b.isBiometricAvailable)); }catch(e){ r(false); } }); }
  if(window.PublicKeyCredential){ try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){} }
  return false;
}
async function bioEnroll(password){
  const b=tgBio();
  if(b){ return await new Promise(res=>{ const run=()=>{ try{ b.requestAccess({reason:"Вход и подтверждение переводов по Face ID"},(granted)=>{ if(!granted) return res(false); try{ b.updateBiometricToken(password,(ok)=>res(!!ok)); }catch(e){ res(false); } }); }catch(e){ res(false); } }; if(b.isInited) run(); else b.init(run); }); }
  try{
    if(!window.PublicKeyCredential) return false;
    const uid=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"PMR Wallet"},user:{id:uid,name:"pmr-wallet",displayName:"PMR Wallet"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
    if(!cred) return false;
    S.bioCredId=b64(new Uint8Array(cred.rawId));
    S.bioPw=await encryptSeed(password, bioSecret());
    return true;
  }catch(e){ console.warn("bio enroll",e); return false; }
}
async function bioAuth(){ // -> password string on success, null on fail/cancel
  const b=tgBio();
  if(b){ return await new Promise(res=>{ const run=()=>{ try{ b.authenticate({reason:"Подтвердите по Face ID"},(ok,token)=>res(ok?(token||""):null)); }catch(e){ res(null); } }; if(b.isInited) run(); else b.init(run); }); }
  try{
    if(!window.PublicKeyCredential) return null;
    const asrt=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:S.bioCredId?[{type:"public-key",id:ub64(S.bioCredId)}]:[],userVerification:"required",timeout:60000}});
    if(!asrt) return null;
    return S.bioPw?await decryptSeed(S.bioPw,bioSecret()):"";
  }catch(e){ console.warn("bio auth",e); return null; }
}
async function bioDisable(){
  const b=tgBio();
  if(b){ try{ await new Promise(r=>{ const run=()=>{ try{ b.updateBiometricToken("",()=>r()); }catch(e){ r(); } }; if(b.isInited) run(); else b.init(run); }); }catch(e){} }
  S.bioCredId=null; S.bioPw=null;
}
async function notify(title,body){
  try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg&&tg.HapticFeedback){ try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){} } }catch(e){}
  if(S.settings.notifications && ("Notification" in window)){
    try{
      if(Notification.permission==="granted"){ new Notification(title,{body}); return; }
      if(Notification.permission!=="denied"){ const p=await Notification.requestPermission(); if(p==="granted"){ new Notification(title,{body}); return; } }
    }catch(e){}
  }
  toast(title+(body?" · "+body:""),"ok");

// Resolve an RPC endpoint. Prefer Orbs ton-access (free, decentralised, no key,
// avoids toncenter's harsh anonymous rate limit that caused HTTP 429), fall back
// to toncenter (optionally with the user's API key).
let _endpointCache={};
async function resolveEndpoint(net){
  if(_endpointCache[net]) return _endpointCache[net];
  let ep=null;
  try{ const ta=await importPkg("@orbs-network/ton-access@2.3.3"); ep=await ta.getHttpEndpoint({network:net}); }
  catch(e){ ep=null; }
  if(!ep) ep=ENDPOINTS[net];
  _endpointCache[net]=ep;
  return ep;
}
async function getClient(){
  if(!cryptoReady||!TON) throw new Error("libs");
  const net=S.network;
  const endpoint=await resolveEndpoint(net);
  const opts={endpoint};
  // an API key only helps the toncenter endpoint
  if(S.tonApiKey && endpoint===ENDPOINTS[net]) opts.apiKey=S.tonApiKey;
  return new TON.TonClient(opts);
}
// Retry transient RPC failures (429 rate-limit / 5xx) with exponential backoff.
function isRateErr(e){
  const s=(e&&e.response&&e.response.status)||e&&e.status||0;
  return s===429 || s>=500 || /\b429\b|rate ?limit|too many/i.test(String((e&&e.message)||""));
}
async function withRetry(fn,tries=4){
  let err;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }
    catch(e){ err=e; if(i<tries-1 && isRateErr(e)){ await new Promise(r=>setTimeout(r,500*Math.pow(2,i))); continue; } throw e; }
  }
  throw err;
}
function walletContract(){
  const pub=Buffer.from(S.pubkey,"hex");
  return TON.WalletContractV4.create({workchain:0,publicKey:pub});
}
async function deriveFromMnemonic(words){
  const key=await TCRYPTO.mnemonicToPrivateKey(words);
  const w=TON.WalletContractV4.create({workchain:0,publicKey:key.publicKey});
  return {key, wallet:w, raw:w.address.toString()};
}

async function refreshBalances(){
  if(!await loadLibs()){ renderCurrent(); return; }
  if(!S.addressRaw) return;
  try{
    const client=await getClient();
    const addr=TON.Address.parse(S.addressRaw);
    const prevG=S.balances.GRAM, prevU=S.balances.USDT;
    const bal=await withRetry(()=>client.getBalance(addr));
    let newG=bal.toString(), newU="0";
    if(S.network==="mainnet"){
      try{
        const jm=client.open(TON.JettonMaster.create(TON.Address.parse(USDT_MASTER)));
        const jwAddr=await withRetry(()=>jm.getWalletAddress(addr));
        const jw=client.open(TON.JettonWallet.create(jwAddr));
        newU=(await withRetry(()=>jw.getBalance())).toString();
      }catch(e){ /* no jetton wallet yet => 0 */ newU="0"; }
    }
    S.balances.GRAM=newG; S.balances.USDT=newU;
    if(balancesSynced){ checkIncoming("GRAM",prevG,newG); checkIncoming("USDT",prevU,newU); }
    balancesSynced=true;
    save(); renderCurrent();
  }catch(e){ console.warn("balance refresh failed",e); }
}
// notify + log history when a balance grows (an incoming deposit)
function checkIncoming(asset,prevRaw,newRaw){
  try{
    const dec=ASSET_META[asset].dec;
    const prev=BigInt(prevRaw||"0"), cur=BigInt(newRaw||"0");
    if(cur<=prev) return;
    const delta=fromUnits((cur-prev).toString(),dec);
    const dust=asset==="GRAM"?0.002:0.0005; // skip gas-refund dust
    if(delta<dust) return;
    S.history.unshift({id:"hr"+Date.now(),type:"receive",asset,amount:delta,addr:"",ts:Date.now(),net:S.network,status:"done"});
    save();
    notify("Пополнение",`+${fmtCrypto(delta)} ${asset}`);
  }catch(e){}
}

// Multi-output TON transfer. outs=[{to, amount(human TON), comment?}] (WalletV4: up to 4)
async function sendTonOuts(outs){
  const client=await getClient();
  const w=walletContract();
  const contract=client.open(w);
  const seqno=await withRetry(()=>contract.getSeqno());
  const messages=outs.filter(o=>Number(o.amount)>0).map(o=>TON.internal({
    to:TON.Address.parse(o.to), value:TON.toNano(String(o.amount)), bounce:false, body:o.comment||undefined,
  }));
  await withRetry(()=>contract.sendTransfer({
    secretKey:session.key.secretKey, seqno,
    sendMode: TON.SendMode ? (TON.SendMode.PAY_GAS_SEPARATELY|TON.SendMode.IGNORE_ERRORS) : 3,
    messages,
  }));
  return seqno;
}
async function sendTon(to,amountHuman,comment){ return sendTonOuts([{to,amount:amountHuman,comment}]); }

// Multi-output USDT jetton transfer. outs=[{to, amount(human USDT)}] — each is its own jetton message.
async function sendJettonOuts(outs){
  const client=await getClient();
  const w=walletContract();
  const owner=w.address;
  const jm=client.open(TON.JettonMaster.create(TON.Address.parse(USDT_MASTER)));
  const myJw=await withRetry(()=>jm.getWalletAddress(owner));
  const forwardTon=TON.toNano("0.02");
  const list=outs.filter(o=>Number(o.amount)>0);
  const messages=list.map((o,i)=>{
    const amount=toUnits(o.amount, ASSET_META.USDT.dec);
    const body=TON.beginCell()
      .storeUint(0x0f8a7ea5,32)
      .storeUint(BigInt(Date.now())+BigInt(i),64)
      .storeCoins(amount)
      .storeAddress(TON.Address.parse(o.to))
      .storeAddress(owner)
      .storeMaybeRef(null)
      .storeCoins(forwardTon)
      .storeMaybeRef(null)
      .endCell();
    return TON.internal({to:myJw,value:TON.toNano("0.1"),bounce:true,body});
  });
  const contract=client.open(w);
  const seqno=await withRetry(()=>contract.getSeqno());
  await withRetry(()=>contract.sendTransfer({
    secretKey:session.key.secretKey, seqno,
    sendMode: TON.SendMode ? (TON.SendMode.PAY_GAS_SEPARATELY|TON.SendMode.IGNORE_ERRORS) : 3,
    messages,
  }));
  return seqno;
}
async function sendJetton(to,amountHuman){ return sendJettonOuts([{to,amount:amountHuman}]); }

// Send `amount` of `asset` to `to`, routing the platform fee to FEE_WALLET in the same tx.
// Returns {net, fee}. For USDT each output needs ~0.1 TON gas, so a fee output doubles jetton gas.
async function sendWithFee(asset,to,amount,fee){
  const net=Math.max(0, amount-fee);
  const outs=[{to, amount:net}];
  if(fee>0 && feeEnabled()){ outs.push({to:FEE_WALLET, amount:fee}); }
  if(asset==="USDT") await sendJettonOuts(outs); else await sendTonOuts(outs);
  return {net, fee: (fee>0&&feeEnabled())?fee:0};
}
// gas needed to cover a jetton payment plus (optional) a second jetton fee output
function jettonGasNeeded(withFee){ return withFee ? 0.22 : 0.12; }

// extract a TON address (+ optional amount/comment) from scanned text or a ton:// / https link
function parseTonQr(text){
  text=String(text||"").trim();
  let addr="", amount="", comment="", isTon=false;
  const am=text.match(/([EU]Q[A-Za-z0-9_\-]{46})/);
  if(/^ton:\/\//i.test(text)||/\/transfer\//i.test(text)){
    isTon=true;
    const t=text.match(/transfer\/([A-Za-z0-9_\-:]+)/); if(t) addr=t[1]; else if(am) addr=am[1];
    try{ const u=new URL(text.replace(/^ton:\/\//i,"https://x/"));
      const a=u.searchParams.get("amount"); if(a&&isFinite(Number(a))) amount=String(Number(a)/1e9);
      const c=u.searchParams.get("text")||u.searchParams.get("comment"); if(c) comment=c;
    }catch(e){}
  } else if(am){ addr=am[1]; }
  else { addr=text; }
  return {addr, amount, comment, isTon};
}
async function handleScanned(text){
  closeModal();
  const {addr,amount,isTon}=parseTonQr(text);
  if(!addr){ return toast("QR-код не распознан","err"); }
  if(!await loadLibs()){ return toast("Нет связи с крипто-библиотекой","err"); }
  try{ TON.Address.parse(addr); }catch(e){ return toast("В QR-коде нет корректного TON-адреса","err"); }
  sendState={asset:(isTon&&amount)?"GRAM":"USDT", to:addr, amount:amount||""};
  renderSendForm();
  notify("QR отсканирован", shortAddr(addr));
}
async function startQrScan(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg && typeof tg.showScanQrPopup==="function"){
    try{
      tg.showScanQrPopup({text:"Наведите камеру на QR-код адреса"}, (text)=>{ handleScanned(text); return true; });
      return;
    }catch(e){ /* fall back to browser camera */ }
  }
  await openCameraScanner();
}
async function openCameraScanner(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    closeModal(); return toast("Камера недоступна на этом устройстве","err");
  }
  openModal(`${sheetHead("Сканировать QR")}
    <div class="qr-scan"><video id="qrVideo" playsinline muted autoplay></video><div class="qr-frame"></div></div>
    <p class="hint" style="text-align:center;margin:0 0 12px">Наведите камеру на QR-код TON-адреса</p>
    <button class="btn btn-ghost btn-block" data-act="close-modal">Отмена</button>`);
  let jsQR=null;
  try{ const mod=await importPkg("jsqr@1.4.0"); jsQR=mod.default||mod; }catch(e){}
  const video=el("qrVideo"); if(!video) return;
  let stream=null, raf=0, stopped=false;
  const stop=()=>{ stopped=true; if(raf) cancelAnimationFrame(raf); if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} } };
  _qrStop=stop;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=stream; await video.play().catch(()=>{});
  }catch(e){ stop(); closeModal(); return toast("Нет доступа к камере","err"); }
  if(!jsQR){ /* camera shows, but no decoder — let user cancel */ return; }
  const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});
  const tick=()=>{
    if(stopped) return;
    if(video.readyState>=2 && video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
        if(code&&code.data){ stop(); handleScanned(code.data); return; }
      }catch(e){}
    }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

  else { S.profile.registeredAt=Date.now(); }
  // keep user's own offers showing the new nick
  (S.offers||[]).forEach(o=>{ if(o.mine) o.name=nick; });

async function tradeComplete(id){
  const t=tradeById(id); if(!t||t.status!=="active") return;
  const fee=feeEnabled() ? (t.fee||p2pSideFee(t.crypto,t.amount)) : 0;
  if(fee>0){
    if(!cryptoReady) return toast("Нет связи с сетью TON — комиссия не удержится","err");
    const gasNeed=t.crypto==="USDT"?jettonGasNeeded(false):0.005;
    if(t.crypto==="USDT"&&availableFor("GRAM")<gasNeed) return toast(`Нужно ≈${gasNeed} TON на газ для удержания комиссии`,"err");
    if(S.settings.biometric){ const ok=await bioAuth(); if(ok==null) return toast("Не подтверждено по Face ID","err"); }
    const btn=document.querySelector('[data-act="trade-complete"]'); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Завершение…`; }
    try{
      if(t.crypto==="USDT") await sendJettonOuts([{to:FEE_WALLET,amount:fee}]); else await sendTonOuts([{to:FEE_WALLET,amount:fee}]);
    }catch(e){ const b=document.querySelector('[data-act="trade-complete"]'); if(b){ b.disabled=false; b.textContent="Завершить сделку"; } return toast("Не удалось удержать комиссию: "+((e&&e.message)||"ошибка"),"err"); }
    S.history.unshift({id:"hf"+Date.now(),type:"fee",asset:t.crypto,amount:fee,addr:FEE_WALLET,ts:Date.now(),net:S.network,status:"sent"});
  }
  S.locks=S.locks.filter(l=>l.tradeId!==id);
  t.status="completed"; t.chat.push({who:"sys",text:`Сделка завершена.${fee>0?` Комиссия ${fmtCrypto(fee)} ${t.crypto} удержана.`:""} Средства разблокированы.`,ts:Date.now()});
  save(); notify("Сделка завершена",`${fee>0?`комиссия ${fmtCrypto(fee)} ${t.crypto} · `:""}разблокировано ${fmtCrypto(Math.max(0,t.amount-fee))} ${t.crypto}`);
  if(fee>0) setTimeout(refreshBalances,6000);
  modalTrade(id); renderCurrent();
}
function tradeCancel(id){
  const t=tradeById(id); if(!t||t.status!=="active") return;
  S.locks=S.locks.filter(l=>l.tradeId!==id);
  t.status="canceled"; t.chat.push({who:"sys",text:"Сделка отменена. Средства разблокированы.",ts:Date.now()});
  save(); toast("Сделка отменена · средства разблокированы","");
  modalTrade(id); renderCurrent();
}

/* ===================== ACTIONS ===================== */
async function act(name,ds={}){
  switch(name){
    /* onboarding */
    case "onb-create":{
      toast("Генерация ключей…");
      if(!await loadLibs()){ return toast("Нет связи с крипто-библиотекой. Проверьте интернет.","err"); }
      onbMnemonic=await TCRYPTO.mnemonicNew(24);
      onbStep=2; renderOnboarding(); break;
    }
    case "onb-back": onbStep=1; onbMnemonic=null; renderOnboarding(); break;
    case "copy-seed": if(onbMnemonic){ await copy(onbMnemonic.join(" ")); toast("Seed-фраза скопирована","ok"); } break;
    case "onb-confirm": await finalizeCreate(); break;
    case "onb-import": await modalImport(); break;

    /* lock */
    case "unlock": await doUnlock(); break;
    case "bio-unlock": await doBioUnlock(); break;
    case "toggle-bio": await toggleBio(); break;
    case "forgot": await modalImport(true); break;
    case "lock-now": lockWallet(); break;

    /* nav */
    case "tab": view=ds.tab; hideModalNav(); render(); break;
    case "go-settings": view="settings"; render(); break;
    case "back-home": view="home"; render(); break;
    case "go-history": modalHistory(); break;
    case "refresh": toast("Обновление…"); await refreshBalances(); await fetchPrices(); break;
    case "toggle-balance": hideBalance=!hideBalance; renderCurrent(); break;
    case "card-skin": modalCardSkin(); break;
    case "flip-card": { cardFlipped=!cardFlipped; const c=document.querySelector(".card-inner"); if(c) c.classList.toggle("flipped",cardFlipped); } break;
    case "pick-skin": S.cardSkin=ds.v; save(); closeModal(); renderHome(); toast("Фон карты обновлён","ok"); break;

    /* wallet */
    case "qr-menu": modalQr(); break;
    case "scan-qr": await startQrScan(); break;
    case "deposit": await modalDeposit(); break;
    case "send": modalSend(ds.asset); break;
    case "asset": { const a=ds.asset; if(ASSET_META[a]&&ASSET_META[a].onTon) modalSend(a); else toast(`${a}: приём/отправка доступны для активов сети TON`,""); } break;
    case "copy-addr": { const a=friendlyAddr(); if(a){ await copy(a); toast("Адрес скопирован","ok"); } } break;
    case "send-asset": sendState.asset=ds.v; renderSendForm(); break;
    case "send-max": { const a=sendState.asset; let m=availableFor(a); if(a==="GRAM") m=Math.max(0,m-0.05); sendState.amount=String(Number(m.toFixed(6))); renderSendForm(); } break;
    case "send-next": await sendNext(); break;
    case "send-back": renderSendForm(); break;
    case "send-go": await sendGo(); break;

    /* p2p */
    case "create-offer": if(!myNick()){ toast("Сначала задайте ник","err"); render(); } else modalCreateOffer(); break;
    case "filters": modalFilters(); break;
    case "book": p2pSide=ds.v; lastView=null; renderCurrent(); break;
    case "pick-pin": offerDraft.pin=Number(ds.h); document.querySelectorAll("#pinGrid .pin-opt").forEach(n=>n.classList.toggle("on",Number(n.dataset.h)===offerDraft.pin)); break;
    case "offer-submit": await submitOffer(); break;
    case "apply-filters": readFilters(); closeModal(); renderP2P(); toast("Фильтры применены","ok"); break;

    case "trade": modalTrade(ds.id); break;
    case "join-go": joinTradeGo(ds.id); break;
    case "trade-send": tradeSend(ds.id); break;
    case "trade-complete": await tradeComplete(ds.id); break;

    default: break;
  }
}
function hideModalNav(){ if(el("modal").classList.contains("open")) closeModal(); }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
}

/* ---------- create / import / unlock ---------- */
async function finalizeCreate(){
  modalSetPassword(async(pw)=>{
    try{
      const words=onbMnemonic;
      const d=await deriveFromMnemonic(words);
      S.enc=await encryptSeed(words.join(" "),pw);
      S.addressRaw=d.raw; S.pubkey=Buffer.from(d.key.publicKey).toString("hex");
      S.hasWallet=true; S.locked=false; S.seedConfirmed=true;
      session.mnemonic=words; session.key=d.key; session.unlocked=true;
      onbMnemonic=null; save(); closeModal(); view="home";
      toast("Кошелёк создан","ok"); render();
      refreshBalances(); fetchPrices();
    }catch(e){ console.error(e); toast("Ошибка создания кошелька","err"); }
  });
}
async function modalImport(fromForgot){
  openModal(`${sheetHead("Импорт кошелька")}
    <p class="dim" style="margin-bottom:14px">Введите seed-фразу — по одному слову в каждое поле. Можно вставить всю фразу в первое поле, остальные заполнятся сами.</p>
    <div class="seed-wrap"><div class="seed-grid" id="impGrid">
      ${Array.from({length:24},(_,i)=>`<label class="seed-word seed-input"><i>${i+1}</i><input class="sw-in" id="iw${i}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>`).join("")}
    </div></div>
    <button class="btn btn-ghost btn-block" style="margin-top:12px" id="impPaste">${I.copy} Вставить всю фразу из буфера</button>
    <button class="btn btn-primary btn-lg btn-block" style="margin-top:10px" id="impGo">Продолжить ${I.chev}</button>`,true);
  const fill=(arr,start=0)=>{ arr.forEach((w,k)=>{ const inp=el("iw"+(start+k)); if(inp) inp.value=w.toLowerCase(); }); const n=el("iw"+Math.min(23,start+arr.length)); if(n) n.focus(); };
  const distribute=(text,start=0)=>{ const words=String(text||"").trim().toLowerCase().split(/[\s,;]+/).filter(Boolean); if(words.length>1){ fill(words.slice(0,24-start),start); return true; } return false; };
  const collect=()=>{ const r=[]; for(let i=0;i<24;i++){ r.push(((el("iw"+i)||{}).value||"").trim().toLowerCase()); } return r; };
  const doImport=async()=>{
    const raw=collect();
    if(raw.some(w=>!w)) return toast("Заполните все 24 слова","err");
    toast("Проверка фразы…");
    if(!await loadLibs()) return toast("Крипто-модуль ещё грузится — повторите через пару секунд","err");
    const ok=await TCRYPTO.mnemonicValidate(raw).catch(()=>false);
    if(!ok) return toast("Неверная seed-фраза","err");
    onbMnemonic=raw;
    modalSetPassword(async(pw)=>{
      try{
        const d=await deriveFromMnemonic(raw);
        S.enc=await encryptSeed(raw.join(" "),pw);
        S.addressRaw=d.raw; S.pubkey=Buffer.from(d.key.publicKey).toString("hex");
        S.hasWallet=true; S.locked=false; S.seedConfirmed=true;
        session.mnemonic=raw; session.key=d.key; session.unlocked=true;
        onbMnemonic=null; save(); closeModal(); view="home";
        toast("Кошелёк импортирован","ok"); render(); refreshBalances(); fetchPrices();
      }catch(e){ toast("Ошибка импорта","err"); }
    },{title:"Задайте пароль"});
  };
  setTimeout(()=>{
    for(let i=0;i<24;i++){
      const inp=el("iw"+i); if(!inp) continue;
      inp.addEventListener("paste",e=>{ const t=(e.clipboardData||window.clipboardData).getData("text"); if(distribute(t,i)) e.preventDefault(); });
      inp.addEventListener("input",e=>{ const v=e.target.value; if(/\s/.test(v)){ const parts=v.trim().split(/\s+/); e.target.value=parts[0]; if(parts.length>1) fill(parts.slice(1),i+1); else { const n=el("iw"+(i+1)); if(n)n.focus(); } } });
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const n=el("iw"+(i+1)); if(n)n.focus(); else doImport(); } });
    }
    const f=el("iw0"); if(f) f.focus();
    el("impPaste").onclick=async()=>{ try{ const t=await navigator.clipboard.readText(); if(distribute(t,0)) toast("Фраза вставлена","ok"); else toast("В буфере нет фразы из нескольких слов",""); }catch(e){ toast("Нет доступа к буферу — вставьте вручную","err"); } };
    el("impGo").onclick=doImport;
  },40);
}
async function doUnlock(){

  if(!pw) return toast("Введите пароль","err");
  if(!await loadLibs()) return toast("Нет связи с крипто-библиотекой","err");
  try{
    const words=(await decryptSeed(S.enc,pw)).split(" ");
    const d=await deriveFromMnemonic(words);
    session.mnemonic=words; session.key=d.key; session.unlocked=true;
    S.locked=false; save(); view="home"; render();
    refreshBalances(); fetchPrices();

}

/* ---------- send flow ---------- */
async function sendNext(){
  const {asset,to,amount}=sendState;
  const amt=Number(String(amount).replace(",","."));
  if(!to||to.length<10) return toast("Введите адрес получателя","err");
  if(!cryptoReady){ return toast("Нет связи с сетью TON","err"); }
  try{ TON.Address.parse(to); }catch(e){ return toast("Некорректный TON-адрес","err"); }
  if(!amt||amt<=0) return toast("Введите сумму","err");
  if(asset==="USDT"&&S.network==="testnet") return toast("USDT недоступен в Testnet","err");
  const avail=availableFor(asset);
  if(amt>avail) return toast(`Недостаточно средств. Доступно ${fmtCrypto(avail)} ${asset}`,"err");
  const feeOut=withdrawFee(asset,amt)>0;
  if(asset==="USDT"){ // need TON for gas (two jetton outputs when a fee is routed)
    const need=jettonGasNeeded(feeOut);
    const tonAvail=availableFor("GRAM");
    if(tonAvail<need) return toast(`Нужно ≈${need} TON на газ для перевода USDT${feeOut?" (перевод + комиссия)":""}`,"err");
  }
  modalSendConfirm();
}
async function sendGo(){
  const {asset,to,amount}=sendState;
  const amt=Number(String(amount).replace(",","."));
  if(S.settings.biometric){ const ok=await bioAuth(); if(ok==null) return toast("Перевод не подтверждён по Face ID","err"); }
  const btn=el("sendGo"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Отправка…`; }
  try{
    const fee=withdrawFee(asset,amt);
    const {net}=await sendWithFee(asset,to,amt,fee);
    S.history.unshift({id:"h"+Date.now(),type:"send",asset,amount:net,fee,addr:to,ts:Date.now(),net:S.network,status:"sent"});
    if(fee>0) S.history.unshift({id:"hf"+Date.now(),type:"fee",asset,amount:fee,addr:FEE_WALLET,ts:Date.now(),net:S.network,status:"sent"});
    save();
    notify("Перевод отправлен",`${fmtCrypto(net)} ${asset}${fee>0?` · комиссия ${fmtCrypto(fee)} ${asset}`:""}`);
    const a=friendlyAddr();
    closeModal();
    modalResult(true,"Отправлено",`Транзакция передана в сеть. Баланс обновится после подтверждения.${fee>0?`<br>Комиссия сервиса ${fmtCrypto(fee)} ${asset} удержана.`:""}`,`${SCAN[S.network]}/${a}`);
    setTimeout(refreshBalances,6000);
  }catch(e){
    console.error(e);
    closeModal();
    modalResult(false,"Не удалось отправить", esc((e&&e.message)||"Ошибка сети. Попробуйте позже."));
  }
}

/* ---------- p2p logic ---------- */
function readFilters(){
  p2pFilter.crypto=el("fCrypto").value; p2pFilter.fiat=el("fFiat").value;
}
async function submitOffer(){
  const d=offerDraft;
  const price=Number(String(d.price).replace(",",".")), min=Number(String(d.min).replace(",",".")), max=Number(String(d.max).replace(",","."));
  if(!price||price<=0) return toast("Укажите цену","err");
  if(!min||!max||min<=0||max<min) return toast("Проверьте лимиты","err");
  let lock=null;
  if(d.side==="sell"){
    if(!ASSET_META[d.crypto].onTon) return toast(`${d.crypto} вне сети TON — продажа недоступна`,"err");
    const amt=max/price;
    const avail=availableFor(d.crypto);
    if(amt>avail) return toast(`Недостаточно средств для блокировки. Нужно ${fmtCrypto(amt)} ${d.crypto}, доступно ${fmtCrypto(avail)}`,"err");
    lock={amount:amt,asset:d.crypto};
  }
  const id="of"+Date.now();
  const offer={id,side:d.side,crypto:d.crypto,fiat:d.fiat,price,min,max,method:d.method,pin:d.pin,mine:true,name:myNick()||"Мой оффер",demo:false,ts:Date.now()};
  S.offers.unshift(offer);
  if(lock){ S.locks.push({id:"lk"+Date.now(),asset:lock.asset,amount:lock.amount,reason:"offer",offerId:id,ts:Date.now()}); }
  save(); closeModal(); renderP2P();
  toast(lock?`Оффер опубликован · ${fmtCrypto(lock.amount)} ${lock.asset} заблокировано`:"Оффер опубликован","ok");
}
function cancelOffer(id){
  S.offers=S.offers.filter(o=>o.id!==id);
  const had=S.locks.some(l=>l.offerId===id);
  S.locks=S.locks.filter(l=>l.offerId!==id);
  save(); closeModal(); renderP2P();
  toast(had?"Оффер снят · средства разблокированы":"Оффер снят","ok");
}
function startTrade(id){
  if(!myNick()){ closeModal(); toast("Сначала завершите регистрацию","err"); render(); return; }
  modalJoinTrade(id);
}
async function releaseGo(id){
  const o=S.offers.find(x=>x.id===id); const lk=S.locks.find(l=>l.offerId===id);
  if(!o||!lk) return;
  const to=el("relTo").value.trim();
  const amt=Number(String(el("relAmt").value).replace(",","."));
  if(!cryptoReady) return toast("Нет связи с сетью TON","err");
  try{ TON.Address.parse(to); }catch(e){ return toast("Некорректный адрес","err"); }
  const buyerFee=p2pSideFee(lk.asset,amt), sellerFee=p2pSideFee(lk.asset,amt);
  const totalFee=buyerFee+sellerFee;
  // delivery (amt) + seller's own fee are both taken from the locked collateral
  if(!amt||amt<=0||amt+sellerFee>lk.amount+1e-9) return toast("Сумма с учётом комиссии больше заблокированной","err");
  const gasNeed=lk.asset==="USDT"?jettonGasNeeded(totalFee>0):0.005;
  if(lk.asset==="USDT"&&availableFor("GRAM")<gasNeed) return toast(`Нужно ≈${gasNeed} TON на газ`,"err");
  if(S.settings.biometric){ const ok=await bioAuth(); if(ok==null) return toast("Перевод не подтверждён по Face ID","err"); }
  const btn=document.querySelector('[data-act="release-go"]'); if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Отправка…`;}
  try{
    const buyerGets=Math.max(0,amt-buyerFee);
    const outs=[{to, amount:buyerGets}];
    if(totalFee>0 && feeEnabled()) outs.push({to:FEE_WALLET, amount:totalFee});
    if(lk.asset==="USDT") await sendJettonOuts(outs); else await sendTonOuts(outs);
    notify("Средства отправлены",`${fmtCrypto(buyerGets)} ${lk.asset}${totalFee>0?` · комиссия ${fmtCrypto(totalFee)} ${lk.asset}`:""}`);
    // reduce / remove lock (delivery + seller fee)
    lk.amount=Math.max(0,lk.amount-amt-sellerFee);
    if(lk.amount<1e-9){ S.locks=S.locks.filter(l=>l.id!==lk.id); S.offers=S.offers.filter(x=>x.id!==id); }
    S.history.unshift({id:"h"+Date.now(),type:"p2p-release",asset:lk.asset,amount:buyerGets,fee:totalFee,addr:to,ts:Date.now(),net:S.network,status:"sent"});
    if(totalFee>0) S.history.unshift({id:"hf"+Date.now(),type:"fee",asset:lk.asset,amount:totalFee,addr:FEE_WALLET,ts:Date.now(),net:S.network,status:"sent"});
    save(); closeModal();
    modalResult(true,"Средства отправлены",`Сделка завершена, перевод передан в сеть.${totalFee>0?`<br>Комиссия ${fmtCrypto(totalFee)} ${lk.asset} удержана.`:""}`,`${SCAN[S.network]}/${friendlyAddr()}`);
    setTimeout(()=>{refreshBalances();renderP2P();},6000);
  }catch(e){ closeModal(); modalResult(false,"Ошибка перевода",esc((e&&e.message)||"Попробуйте позже.")); }
}

/* ---------- history ---------- */
function modalHistory(){
  const h=S.history;
  const rows=h.length?h.map(x=>{
    const sign=x.type==="receive"?"+":"−";
    const color=x.type==="receive"?"var(--buy)":(x.type==="fee"?"var(--warn)":"var(--ink)");
    const t=x.type==="send"?"Отправка":x.type==="receive"?"Пополнение":x.type==="p2p-release"?"P2P выплата":x.type==="fee"?"Комиссия сервиса":x.type;
    return `<div class="asset" style="border-top:1px solid var(--line)">
      <div class="coin" style="width:36px;height:36px;background:var(--panel-3);color:var(--ink-2)">${x.type==="receive"?I.down:I.up}</div>
      <div class="nm"><b>${t}</b><span>${esc(shortAddr(x.addr))} · ${nowShort(x.ts)}</span></div>
      <div class="bal"><b style="color:${color}">${sign}${fmtCrypto(x.amount)} ${x.asset}</b><span>${x.net}</span></div>
    </div>`;
  }).join(""):`<div class="empty">Пока нет операций.</div>`;
  openModal(`${sheetHead("История")}
    <div class="assets" style="background:transparent;border:none">${rows}</div>
    ${h.length?`<a class="tlink" style="display:block;text-align:center;margin-top:14px" href="${SCAN[S.network]}/${friendlyAddr()}" target="_blank" rel="noopener">Все операции в обозревателе ↗</a>`:""}`);
}

/* ===================== boot ===================== */
function bindEvents(){
  document.body.addEventListener("click",e=>{
    const t=e.target.closest("[data-act]");
    if(!t) return;
    const name=t.dataset.act;
    const ds={...t.dataset};
    act(name,ds);
  });
}
function applyTheme(){ S.settings.theme="light"; document.documentElement.setAttribute("data-theme","light"); syncTgColors(); }
function syncTgColors(){
  try{ const tg=window.Telegram&&window.Telegram.WebApp; if(!tg) return;
    if(tg.setBackgroundColor) tg.setBackgroundColor("#f3f5f9");
    if(tg.setHeaderColor) tg.setHeaderColor("#ffffff");
    if(tg.setBottomBarColor) tg.setBottomBarColor("#ffffff");
  }catch(e){}
}
function tgInit(){
  try{
    const tg=window.Telegram&&window.Telegram.WebApp; if(!tg) return;
    try{ tg.ready(); }catch(e){}
    try{ tg.expand(); }catch(e){}
    try{ if(tg.requestFullscreen) tg.requestFullscreen(); }catch(e){}
    try{ if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
    syncTgColors();
  }catch(e){}
}

async function boot(){
  load(); tgInit(); applyTheme(); bindEvents();
  // Session key lives only in memory; after any reload it is gone, so a saved
  // "unlocked" flag must never grant access — always require the password.
  if(S.hasWallet) S.locked=true;
  render();
  // background: libs + data
  loadLibs().then(ok=>{
    if(!S.hasWallet) return;
    if(!S.locked){ refreshBalances(); }
    renderCurrent();
  });
  fetchPrices();
  // periodic refresh when unlocked (any screen, so deposit alerts arrive everywhere)
  refreshTimer=setInterval(()=>{ if(S.hasWallet&&!S.locked&&cryptoReady) refreshBalances(); },30000);
}
boot();
