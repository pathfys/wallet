# Nginx config for pl-wallet.com + api.pl-wallet.com
# Symlink to /etc/nginx/sites-enabled/ and reload: sudo nginx -s reload

# --- Mini-app (static) --------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pl-wallet.com www.pl-wallet.com;

    ssl_certificate     /etc/letsencrypt/live/pl-wallet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pl-wallet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # pl.html, the TonConnect manifest, icon, terms, privacy — all static.
    root /var/www/pl-wallet;
    index pl.html;

    # Must be served as application/json with CORS so wallets can read it.
    location = /tonconnect-manifest.json {
        add_header Content-Type "application/json" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Cache static for 5 min so a new deploy doesn't cost reload-on-save.
    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }
}

# --- REST + admin API ---------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pl-wallet.com;

    ssl_certificate     /etc/letsencrypt/live/api.pl-wallet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pl-wallet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Trust the local nginx for X-Forwarded-For; the aiohttp RateLimiter
    # keys on the client IP taken from that header.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Modest body-size limit — all our writes are JSON blobs well under this.
    client_max_body_size 64k;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- HTTP → HTTPS redirect ----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pl-wallet.com www.pl-wallet.com api.pl-wallet.com;
    location / { return 301 https://$host$request_uri; }
}
