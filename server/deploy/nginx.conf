# nginx перед PMR Wallet: TLS, первая линия защиты от DDoS (лимиты запросов/соединений,
# таймауты против slowloris), WebSocket. Для крупных атак добавьте Cloudflare/аналог.
limit_req_zone  $binary_remote_addr zone=pmr_api:20m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=pmr_login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pmr_conn:10m;

server {
    listen 80;
    server_name wallet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wallet.example.com;

    ssl_certificate     /etc/letsencrypt/live/wallet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    client_max_body_size   4m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      15s;
    send_timeout           15s;
    large_client_header_buffers 4 16k;
    limit_conn pmr_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location = /api/auth/login {
        limit_req zone=pmr_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    # вебхук бота: только подсети Telegram (https://core.telegram.org/bots/webhooks), без общего limit_req
    location = /api/tg/webhook {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny  all;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /api/ws {
        limit_req zone=pmr_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
    location /api/ {
        limit_req zone=pmr_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        limit_req zone=pmr_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;   # index.html, vendor/, icons/ (сервер ставит CSP и кеш-заголовки)
    }
}
